<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="/style.css">
<style>
body{padding:0 0 40px}
.panel{max-width:900px;margin:0 auto;padding:20px 16px}
.bx{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
input,select,textarea{width:100%;background:#0e0e13;border:1px solid var(--line);color:#fff;border-radius:8px;padding:10px;font-size:14px;font-family:inherit;margin-bottom:8px}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:9px 0;font-size:14px}
.item a,.item button{font-size:13px;color:var(--gold);background:none;border:0;cursor:pointer;margin-left:12px}
.del{color:#e57373!important}
h2{font-size:17px;margin-bottom:10px}
.hide{display:none}
.prev{width:100%;max-height:150px;object-fit:cover;border-radius:9px;border:1px solid var(--line);margin-bottom:8px;display:block}
.urls a{color:var(--gold);display:block;margin-bottom:4px}
.cnt{font-size:12px;color:var(--muted);margin-bottom:8px}
</style>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
<div class="panel" id="login">
  <h2>Panel girişi</h2>
  <div class="bx">
    <label>E-posta</label><input id="em" type="email">
    <label>Şifre</label><input id="pw" type="password">
    <div class="cf-turnstile" data-sitekey="0x4AAAAAAGJrKVfzeFsacVeT" data-theme="dark" style="margin-bottom:10px"></div>
    <button class="btn" id="btnLogin">Giriş</button>
    <p id="err" style="color:#e57373;font-size:13px;margin-top:8px"></p>
  </div>
</div>

<div class="panel hide" id="app">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <h2>Panel</h2>
    <button class="btn-o" id="btnOut">Çıkış</button>
  </div>

  <div class="bx">
    <h2>Ana sayfa görseli</h2>
    <img class="prev" id="heroPrev">
    <input id="heroUp" type="file" accept="image/*">
    <p id="heroMsg" style="font-size:13px"></p>
  </div>

  <div class="bx">
    <h2>Bölge görselleri</h2>
    <div id="regions"></div>
    <p id="regMsg" style="font-size:13px"></p>
  </div>

  <div class="bx">
    <h2>Görsel aracı</h2>
    <p style="font-size:13px;color:var(--muted);margin-bottom:8px">Fotoğraf seç, otomatik WebP'ye çevrilip küçültülür ve yüklenir. Çıkan adresleri site dosyalarında kullanabilirsin.</p>
    <input id="toolFiles" type="file" accept="image/*" multiple>
    <div class="urls" id="toolUrls"></div>
    <p id="toolMsg" style="font-size:13px;margin-top:8px"></p>
  </div>

  <div class="bx">
    <h2>Yazılar</h2>
    <div id="plist"></div>
  </div>

  <div class="bx">
    <h2 id="postTitle">Yeni yazı</h2>
    <input type="hidden" id="pid">
    <label>Başlık</label><input id="ptitle">
    <label>Adres (slug)</label><input id="pslug">
    <label>Kapak görseli</label>
    <div id="pimgWrap" class="hide">
      <img class="prev" id="pimgPrev">
      <button class="btn-o" id="pimgDel" style="margin-bottom:8px">Görseli kaldır</button>
    </div>
    <input id="pimg" type="file" accept="image/*">
    <label>SEO açıklaması (max 160 karakter)</label>
    <input id="pmeta" maxlength="170">
    <div class="cnt" id="pmetaCnt">0 / 160</div>
    <label>SSS — her satıra bir soru | cevap</label>
    <textarea id="pfaq" rows="5" placeholder="Fiyatlar ne kadar? | 30 dakika 7000 TL, 1 saat 12000 TL.&#10;Ön ödeme var mı? | Yok, ödeme görüşme sırasında."></textarea>
    <label>İçerik</label>
    <textarea id="pbody" rows="14" placeholder="Paragrafları boş satırla ayır. Alt başlık için başına ## koy."></textarea>
    <div class="row2">
      <div><label>Yayında (1/0)</label><input id="ppub" type="number" value="0"></div>
    </div>
    <button class="btn" id="btnPSave">Kaydet</button>
    <button class="btn-o" id="btnPNew">Yeni</button>
    <p id="pmsg" style="font-size:13px;margin-top:8px"></p>
  </div>

  <div class="bx">
    <h2>Ayarlar</h2>
    <label>WhatsApp (905xx)</label><input id="swa">
    <label>Telegram</label><input id="stg">
    <label>Marka</label><input id="sbr">
    <button class="btn" id="btnSet">Kaydet</button>
    <p id="smsg" style="font-size:13px;margin-top:8px"></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=supabase.createClient("https://accerzwswgiqhtfgoeqv.supabase.co","sb_publishable_MghJlNwUcMgsHY6UfQ9hSw_gDfS_HfG");
let regions=[],curPostImg=null;

const el=id=>document.getElementById(id);
const slugify=s=>s.toLowerCase().replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

async function shrink(file,maxW,quality){
  const bmp=await createImageBitmap(file);
  const scale=Math.min(1,maxW/bmp.width);
  const c=document.createElement("canvas");
  c.width=Math.max(1,Math.round(bmp.width*scale));
  c.height=Math.max(1,Math.round(bmp.height*scale));
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return await new Promise(r=>c.toBlob(r,"image/webp",quality));
}

async function uploadWebp(file,bucket,maxW,quality){
  const blob=await shrink(file,maxW,quality);
  const name=Date.now()+"-"+Math.random().toString(36).slice(2,7)+".webp";
  const {error}=await db.storage.from(bucket).upload(name,blob,{contentType:"image/webp"});
  if(error)throw error;
  return db.storage.from(bucket).getPublicUrl(name).data.publicUrl;
}

async function start(){
  const {data:{session}}=await db.auth.getSession();
  if(!session)return;
  el("login").classList.add("hide");el("app").classList.remove("hide");
  const {data:r}=await db.from("regions").select("id,slug,name,img").order("sort");
  regions=r||[];
  const {data:s}=await db.from("settings").select("key,value");
  const c={};(s||[]).forEach(x=>c[x.key]=x.value);
  el("swa").value=c.whatsapp||"";el("stg").value=c.telegram||"";el("sbr").value=c.brand||"";
  if(c.hero)el("heroPrev").src=c.hero;
  drawRegions();
  loadPosts();
}

function drawRegions(){
  el("regions").innerHTML=regions.map(r=>
    `<div style="border-bottom:1px solid var(--line);padding:10px 0">
      <b style="font-size:14px">${r.name}</b>
      ${r.img?`<img class="prev" src="${r.img}">`:""}
      <input type="file" accept="image/*" data-r="${r.id}">
    </div>`).join("");
  el("regions").querySelectorAll("input[type=file]").forEach(inp=>{
    inp.onchange=async()=>{
      const f=inp.files[0];if(!f)return;
      el("regMsg").textContent="Yükleniyor…";
      try{
        const url=await uploadWebp(f,"img",1600,0.78);
        await db.from("regions").update({img:url}).eq("id",inp.dataset.r);
        const rec=regions.find(x=>x.id===inp.dataset.r);if(rec)rec.img=url;
        drawRegions();el("regMsg").textContent="Güncellendi";
      }catch(e){el("regMsg").textContent=e.message}
    };
  });
}

el("heroUp").onchange=async()=>{
  const f=el("heroUp").files[0];if(!f)return;
  el("heroMsg").textContent="Yükleniyor…";
  try{
    const url=await uploadWebp(f,"img",1800,0.8);
    await db.from("settings").upsert({key:"hero",value:url});
    el("heroPrev").src=url;
    el("heroMsg").textContent="Güncellendi";
  }catch(e){el("heroMsg").textContent=e.message}
  el("heroUp").value="";
};

el("btnLogin").onclick=async()=>{
  el("err").textContent="";
  const tok=window.turnstile?window.turnstile.getResponse():undefined;
  if(!tok)return el("err").textContent="Doğrulama bekleniyor…";
  const {error}=await db.auth.signInWithPassword({email:el("em").value,password:el("pw").value,options:{captchaToken:tok}});
  if(error){if(window.turnstile)window.turnstile.reset();return el("err").textContent=error.message}
  location.reload();
};
el("btnOut").onclick=async()=>{await db.auth.signOut();location.reload()};

el("toolFiles").onchange=async()=>{
  const files=[...el("toolFiles").files];
  if(!files.length)return;
  el("toolUrls").innerHTML="";el("toolMsg").textContent="İşleniyor…";
  let err="";
  for(const f of files){
    try{
      const url=await uploadWebp(f,"img",1600,0.78);
      const a=document.createElement("a");
      a.href=url;a.textContent=url;a.target="_blank";
      el("toolUrls").appendChild(a);
    }catch(e){err=e.message}
  }
  el("toolMsg").textContent=err||"Bitti. Adreslere tıklayıp kopyalayabilirsin.";
  el("toolFiles").value="";
};

async function loadPosts(){
  const {data}=await db.from("posts").select("id,slug,title,published").order("created_at",{ascending:false});
  el("plist").innerHTML=(data||[]).map(p=>
    `<div class="item"><span>${p.title} ${p.published?"":"(taslak)"}</span>
     <span><a href="#" data-pe="${p.id}">düzenle</a><button class="del" data-pd="${p.id}">sil</button></span></div>`
  ).join("")||'<p style="color:var(--muted);font-size:14px">Yazı yok.</p>';
  el("plist").querySelectorAll("[data-pe]").forEach(a=>a.onclick=e=>{e.preventDefault();editPost(a.dataset.pe)});
  el("plist").querySelectorAll("[data-pd]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Yazı silinsin mi?"))return;
    await db.from("posts").delete().eq("id",b.dataset.pd);loadPosts();
  });
}

function drawPostImg(){
  if(curPostImg){
    el("pimgPrev").src=curPostImg;
    el("pimgWrap").classList.remove("hide");
  }else{
    el("pimgPrev").removeAttribute("src");
    el("pimgWrap").classList.add("hide");
  }
}

el("pmeta").oninput=()=>{el("pmetaCnt").textContent=el("pmeta").value.length+" / 160"};
el("pimgDel").onclick=()=>{curPostImg=null;el("pimg").value="";drawPostImg()};

async function editPost(id){
  const {data:p}=await db.from("posts").select("*").eq("id",id).single();
  el("postTitle").textContent="Yazıyı düzenle";
  el("pid").value=p.id;el("ptitle").value=p.title;el("pslug").value=p.slug;
  el("pbody").value=p.body;el("ppub").value=p.published?1:0;
  el("pmeta").value=p.meta||"";el("pfaq").value=p.faq||"";
  el("pmetaCnt").textContent=(p.meta||"").length+" / 160";
  curPostImg=p.img||null;el("pimg").value="";drawPostImg();
  window.scrollTo(0,0);
}

el("btnPNew").onclick=()=>{
  el("postTitle").textContent="Yeni yazı";el("pid").value="";
  ["ptitle","pslug","pbody","pmeta","pfaq"].forEach(i=>el(i).value="");
  el("ppub").value=0;el("pmetaCnt").textContent="0 / 160";
  curPostImg=null;el("pimg").value="";drawPostImg();
};

el("btnPSave").onclick=async()=>{
  el("pmsg").textContent="Kaydediliyor…";
  const title=el("ptitle").value.trim();
  const body=el("pbody").value.trim();
  if(!title||!body)return el("pmsg").textContent="Başlık ve içerik zorunlu";
  const slug=el("pslug").value.trim()||slugify(title);
  let img=curPostImg;
  const f=el("pimg").files[0];
  if(f){
    try{img=await uploadWebp(f,"img",1200,0.8)}catch(e){return el("pmsg").textContent=e.message}
  }
  const rec={title,body,slug,img,meta:el("pmeta").value.trim()||null,faq:el("pfaq").value.trim()||null,published:el("ppub").value==="1"};
  const id=el("pid").value;
  if(id){
    const {error}=await db.from("posts").update(rec).eq("id",id);
    if(error)return el("pmsg").textContent=error.message;
  }else{
    const {data,error}=await db.from("posts").insert(rec).select().single();
    if(error)return el("pmsg").textContent=error.message;
    el("pid").value=data.id;
    el("postTitle").textContent="Yazıyı düzenle";
  }
  curPostImg=img;el("pimg").value="";drawPostImg();
  el("pmsg").textContent="Kaydedildi";
  loadPosts();
};

el("btnSet").onclick=async()=>{
  for(const [k,v] of [["whatsapp",el("swa").value],["telegram",el("stg").value],["brand",el("sbr").value]]){
    await db.from("settings").upsert({key:k,value:v});
  }
  el("smsg").textContent="Ayarlar kaydedildi";
};

start();
</script>
</body>
</html>
