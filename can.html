<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="/style.css">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
body{padding:0 0 40px}
.panel{max-width:900px;margin:0 auto;padding:20px 16px}
.bx{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
input,select,textarea{width:100%;background:#0e0e13;border:1px solid var(--line);color:#fff;border-radius:8px;padding:10px;font-size:14px;font-family:inherit;margin-bottom:8px}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.item{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:9px 0;font-size:14px}
.item a,.item button{font-size:13px;color:var(--gold);background:none;border:0;cursor:pointer;margin-left:12px}
.del{color:#e57373!important}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.thumbs div{position:relative}
.thumbs img{width:80px;height:106px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.thumbs button{position:absolute;top:2px;right:2px;background:#000a;color:#fff;border:0;border-radius:5px;font-size:11px;padding:2px 6px;cursor:pointer}
h2{font-size:17px;margin-bottom:10px}
.hide{display:none}
</style>
</head>
<body>
<div class="panel" id="login">
  <h2>Panel girişi</h2>
  <div class="bx">
    <label>E-posta</label><input id="em" type="email">
    <label>Şifre</label><input id="pw" type="password">
    <div class="cf-turnstile" data-sitekey="0x4AAAAAAAGJzKvFzeFacVeT" data-theme="dark" style="margin-bottom:10px"></div>
    <button class="btn" id="btnLogin">Giriş</button>
    <p id="err" style="color:#e57373;font-size:13px;margin-top:8px"></p>
  </div>
</div>

<div class="panel hide" id="app">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <h2>Panel</h2>
    <button class="btn-o" id="btnOut">Çıkış</button>
  </div>

  <div class="bx">
    <h2>Modeller</h2>
    <div id="list"></div>
  </div>

  <div class="bx">
    <h2 id="formTitle">Yeni model</h2>
    <input type="hidden" id="fid">
    <label>Ad</label><input id="fname">
    <label>Bölge</label><select id="fregion"></select>
    <div class="row3">
      <div><label>Yaş</label><input id="fage" type="number"></div>
      <div><label>Boy (cm)</label><input id="fheight" type="number"></div>
      <div><label>Kilo</label><input id="fweight" type="number"></div>
    </div>
    <div class="row3">
      <div><label>Saç</label><input id="fhair"></div>
      <div><label>Göz</label><input id="feyes"></div>
      <div><label>Ten</label><input id="fskin"></div>
    </div>
    <label>Tanıtım</label><textarea id="fabout" rows="3"></textarea>
    <div class="row2">
      <div><label>VIP (1/0)</label><input id="fvip" type="number" value="0"></div>
      <div><label>Sıra</label><input id="fsort" type="number" value="0"></div>
    </div>
    <label>Fotoğraf ekle</label><input id="fupload" type="file" accept="image/*" multiple>
    <div class="thumbs" id="thumbs"></div>
    <button class="btn" id="btnSave">Kaydet</button>
    <button class="btn-o" id="btnNew">Yeni</button>
    <p id="msg" style="font-size:13px;margin-top:8px"></p>
  </div>

  <div class="bx">
    <h2>Yazılar</h2>
    <div id="plist"></div>
  </div>

  <div class="bx">
    <h2 id="postTitle">Yeni yazı</h2>
    <input type="hidden" id="pid">
    <label>Başlık</label><input id="ptitle">
    <label>Adres (slug)</label><input id="pslug">
    <label>İçerik</label>
    <textarea id="pbody" rows="12" placeholder="Paragrafları boş satırla ayır. Alt başlık için başına ## koy."></textarea>
    <div class="row2">
      <div><label>Yayında (1/0)</label><input id="ppub" type="number" value="0"></div>
    </div>
    <button class="btn" id="btnPSave">Kaydet</button>
    <button class="btn-o" id="btnPNew">Yeni</button>
    <p id="pmsg" style="font-size:13px;margin-top:8px"></p>
  </div>

  <div class="bx">
    <h2>Ayarlar</h2>
    <label>WhatsApp (905xx)</label><input id="swa">
    <label>Telegram</label><input id="stg">
    <label>Marka</label><input id="sbr">
    <button class="btn" id="btnSet">Kaydet</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=supabase.createClient("https://accerzwswgiqhtfgoeqv.supabase.co","sb_publishable_MghJlNwUcMgsHY6UfQ9hSw_gDfS_HfG");
let regions=[],curPhotos=[];

const el=id=>document.getElementById(id);
const slugify=s=>s.toLowerCase().replace(/ı/g,"i").replace(/ş/g,"s").replace(/ğ/g,"g").replace(/ü/g,"u").replace(/ö/g,"o").replace(/ç/g,"c").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");

async function start(){
  const {data:{session}}=await db.auth.getSession();
  if(!session)return;
  el("login").classList.add("hide");el("app").classList.remove("hide");
  const {data:r}=await db.from("regions").select("id,slug,name").order("sort");
  regions=r||[];
  el("fregion").innerHTML=regions.map(x=>`<option value="${x.id}">${x.name}</option>`).join("");
  const {data:s}=await db.from("settings").select("key,value");
  const c={};(s||[]).forEach(x=>c[x.key]=x.value);
  el("swa").value=c.whatsapp||"";el("stg").value=c.telegram||"";el("sbr").value=c.brand||"";
  load();loadPosts();
}

el("btnLogin").onclick=async()=>{
  el("err").textContent="";
  const tok=window.turnstile?window.turnstile.getResponse():undefined;
  if(!tok)return el("err").textContent="Doğrulama bekleniyor…";
  const {error}=await db.auth.signInWithPassword({email:el("em").value,password:el("pw").value,options:{captchaToken:tok}});
  if(error){if(window.turnstile)window.turnstile.reset();return el("err").textContent=error.message}
  location.reload();
};
el("btnOut").onclick=async()=>{await db.auth.signOut();location.reload()};

async function load(){
  const {data}=await db.from("models").select("id,slug,name,is_active,regions(name)").order("sort");
  el("list").innerHTML=(data||[]).map(m=>
    `<div class="item"><span>${m.name} · ${m.regions?.name||"-"} ${m.is_active?"":"(pasif)"}</span>
     <span><a href="#" data-e="${m.id}">düzenle</a><button class="del" data-d="${m.id}">sil</button></span></div>`
  ).join("")||'<p style="color:var(--muted);font-size:14px">Kayıt yok.</p>';
  el("list").querySelectorAll("[data-e]").forEach(a=>a.onclick=e=>{e.preventDefault();edit(a.dataset.e)});
  el("list").querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>del(b.dataset.d));
}

async function edit(id){
  const {data:m}=await db.from("models").select("*").eq("id",id).single();
  el("formTitle").textContent="Modeli düzenle";
  el("fid").value=m.id;el("fname").value=m.name;el("fregion").value=m.region_id||"";
  el("fage").value=m.age||"";el("fheight").value=m.height||"";el("fweight").value=m.weight||"";
  el("fhair").value=m.hair||"";el("feyes").value=m.eyes||"";el("fskin").value=m.skin||"";
  el("fabout").value=m.about||"";el("fvip").value=m.vip?1:0;el("fsort").value=m.sort||0;
  const {data:p}=await db.from("model_photos").select("id,url").eq("model_id",id).order("sort");
  curPhotos=p||[];drawThumbs();
  window.scrollTo(0,0);
}

function drawThumbs(){
  el("thumbs").innerHTML=curPhotos.map(p=>
    `<div><img src="${p.url}"><button data-p="${p.id}">x</button></div>`).join("");
  el("thumbs").querySelectorAll("[data-p]").forEach(b=>b.onclick=async()=>{
    await db.from("model_photos").delete().eq("id",b.dataset.p);
    curPhotos=curPhotos.filter(x=>x.id!==b.dataset.p);drawThumbs();
  });
}

async function del(id){
  if(!confirm("Silinsin mi?"))return;
  await db.from("model_photos").delete().eq("model_id",id);
  await db.from("models").delete().eq("id",id);
  load();
}

el("btnNew").onclick=()=>{
  el("formTitle").textContent="Yeni model";el("fid").value="";
  ["fname","fage","fheight","fweight","fhair","feyes","fskin","fabout"].forEach(i=>el(i).value="");
  el("fvip").value=0;el("fsort").value=0;curPhotos=[];drawThumbs();
};

el("btnSave").onclick=async()=>{
  el("msg").textContent="Kaydediliyor…";
  const rec={name:el("fname").value.trim(),region_id:el("fregion").value||null,
    age:+el("fage").value||null,height:+el("fheight").value||null,weight:+el("fweight").value||null,
    hair:el("fhair").value,eyes:el("feyes").value,skin:el("fskin").value,
    about:el("fabout").value,vip:el("fvip").value==="1",sort:+el("fsort").value||0};
  if(!rec.name)return el("msg").textContent="Ad zorunlu";
  const id=el("fid").value;
  if(id){const {error}=await db.from("models").update(rec).eq("id",id);if(error)return el("msg").textContent=error.message}
  else{
    rec.slug=slugify(rec.name)+"-"+Math.random().toString(36).slice(2,5);
    rec.is_active=true;
    const {data,error}=await db.from("models").insert(rec).select().single();
    if(error)return el("msg").textContent=error.message;
    el("fid").value=data.id;
  }
  const mid=el("fid").value;
  const files=el("fupload").files;
  for(let i=0;i<files.length;i++){
    const f=files[i];
    const path=mid+"/"+Date.now()+"-"+i+"."+(f.name.split(".").pop()||"jpg");
    const {error:ue}=await db.storage.from("foto").upload(path,f);
    if(ue)return el("msg").textContent=ue.message;
    const {data:{publicUrl}}=db.storage.from("foto").getPublicUrl(path);
    await db.from("model_photos").insert({model_id:mid,url:publicUrl,sort:curPhotos.length+i});
  }
  el("fupload").value="";
  el("msg").textContent="Kaydedildi";
  load();
  if(el("fid").value)edit(el("fid").value);
};

async function loadPosts(){
  const {data}=await db.from("posts").select("id,slug,title,published").order("created_at",{ascending:false});
  el("plist").innerHTML=(data||[]).map(p=>
    `<div class="item"><span>${p.title} ${p.published?"":"(taslak)"}</span>
     <span><a href="#" data-pe="${p.id}">düzenle</a><button class="del" data-pd="${p.id}">sil</button></span></div>`
  ).join("")||'<p style="color:var(--muted);font-size:14px">Yazı yok.</p>';
  el("plist").querySelectorAll("[data-pe]").forEach(a=>a.onclick=e=>{e.preventDefault();editPost(a.dataset.pe)});
  el("plist").querySelectorAll("[data-pd]").forEach(b=>b.onclick=async()=>{
    if(!confirm("Yazı silinsin mi?"))return;
    await db.from("posts").delete().eq("id",b.dataset.pd);loadPosts();
  });
}

async function editPost(id){
  const {data:p}=await db.from("posts").select("*").eq("id",id).single();
  el("postTitle").textContent="Yazıyı düzenle";
  el("pid").value=p.id;el("ptitle").value=p.title;el("pslug").value=p.slug;
  el("pbody").value=p.body;el("ppub").value=p.published?1:0;
  window.scrollTo(0,0);
}

el("btnPNew").onclick=()=>{
  el("postTitle").textContent="Yeni yazı";el("pid").value="";
  ["ptitle","pslug","pbody"].forEach(i=>el(i).value="");el("ppub").value=0;
};

el("btnPSave").onclick=async()=>{
  el("pmsg").textContent="Kaydediliyor…";
  const title=el("ptitle").value.trim();
  const body=el("pbody").value.trim();
  if(!title||!body)return el("pmsg").textContent="Başlık ve içerik zorunlu";
  const slug=el("pslug").value.trim()||slugify(title);
  const rec={title,body,slug,published:el("ppub").value==="1"};
  const id=el("pid").value;
  const {error}=id
    ? await db.from("posts").update(rec).eq("id",id)
    : await db.from("posts").insert(rec);
  if(error)return el("pmsg").textContent=error.message;
  el("pmsg").textContent="Kaydedildi";
  loadPosts();
};

el("btnSet").onclick=async()=>{
  for(const [k,v] of [["whatsapp",el("swa").value],["telegram",el("stg").value],["brand",el("sbr").value]]){
    await db.from("settings").upsert({key:k,value:v});
  }
  el("msg").textContent="Ayarlar kaydedildi";
};

start();
</script>
</body>
</html>
