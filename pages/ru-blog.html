<style>

<body>
<!--SHELL:HEADER-->
<main class="wrap">
  <div class="crumb"><a href="/ru">Главная</a> › <span>Блог</span></div>
  <h1>Гиды по эскорту на Кипре</h1>
  <p class="lead">Разница между районами, как устроены цены, что рядом с отелями и на что смотреть на первой встрече.</p>
  <input id="q" type="search" placeholder="Поиск статей: район, тема, имя" autocomplete="off">
  <p id="say"></p>
  <div id="list"></div>
</main>
<!--SHELL:FOOTER-->
<script>
(function () {
  var SB = 'https://accerzwswgiqhtfgoeqv.supabase.co';
  var KEY = 'sb_publishable_MghJlNwUcMgsHY6UfQ9hSw_gDfS_HfG';
  var H = { apikey: KEY, Authorization: 'Bearer ' + KEY };
  var HUB = 'kibrista-yalniz-gelenler-rehberi';
  var YAYIN = 'yayin_at.is.null,yayin_at.lte.now()';
  var LOC = 'ru-RU';
  var list = document.getElementById('list');
  var q = document.getElementById('q');
  var say = document.getElementById('say');
  var hepsi = [];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function ciz(arr, same) {
    if (!arr.length) { list.innerHTML = '<p class="bos">Ничего не найдено.</p>'; return; }
    var out = same === false ? '<p class="bos" style="grid-column:1/-1">Русских статей пока нет — показан турецкий архив.</p>' : '';
    out += arr.map(function (x) {
      var d = new Date(x.yayin_at || x.created_at).toLocaleDateString(LOC);
      var im = x.img ? '<img src="' + esc(x.img) + '" alt="' + esc(x.title) + '" width="600" height="400" loading="lazy" decoding="async">' : '';
      var pin = x.slug === HUB ? '<em class="pin">Избранное</em>' : '';
      var href = (same === false ? '/blog/' : '/ru/blog/') + esc(x.slug);
      return '<a class="post" href="' + href + '">' + im + '<div><b>' + esc(x.title) + '</b><span>' + d + pin + '</span></div></a>';
    }).join('');
    list.innerHTML = out;
  }

  function yukle(p, same) {
    hepsi = (p || []).slice().sort(function (a, b) {
      if (a.slug === HUB) return -1;
      if (b.slug === HUB) return 1;
      return 0;
    });
    if (!hepsi.length) { list.innerHTML = '<p class="bos">Статей пока нет.</p>'; return; }
    say.textContent = hepsi.length + ' статей';
    ciz(hepsi, same);
  }

  fetch(SB + '/rest/v1/posts?select=slug,title,yayin_at,created_at,img&published=eq.true&lang=eq.ru&or=(' + YAYIN + ')&order=yayin_at.desc.nullslast', { headers: H })
    .then(function (r) { if (!r.ok) throw new Error('x'); return r.json(); })
    .then(function (p) {
      if (p && p.length) { yukle(p, true); return; }
      return fetch(SB + '/rest/v1/posts?select=slug,title,yayin_at,created_at,img&published=eq.true&or=(' + YAYIN + ')&order=yayin_at.desc.nullslast', { headers: H })
        .then(function (r) { if (!r.ok) throw new Error('x'); return r.json(); })
        .then(function (t) { yukle(t, false); });
    })
    .catch(function () {
      list.innerHTML = '<p class="bos">Не удалось загрузить статьи.</p>';
    });

  q.addEventListener('input', function () {
    var v = q.value.toLocaleLowerCase(LOC).trim();
    if (!v) { say.textContent = hepsi.length + ' статей'; ciz(hepsi); return; }
    var s = hepsi.filter(function (x) { return String(x.title).toLocaleLowerCase(LOC).indexOf(v) > -1; });
    say.textContent = s.length + ' результатов';
    ciz(s);
  });
})();
</script>
