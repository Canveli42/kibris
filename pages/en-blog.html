<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a1020;color:#e9eef6;font:16px/1.65 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{width:min(1000px,100%);margin:0 auto;padding:0 18px 40px;min-height:52vh}
.crumb{font-size:13px;color:#93a0b4;padding:22px 0 0}

#list{margin-top:24px;display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:700px){#list{grid-template-columns:1fr 1fr;gap:14px}}
.post{display:flex;gap:12px;align-items:center;background:#111823;border:1px solid rgba(216,184,120,.18);border-radius:12px;padding:10px;transition:.18s}
.post:hover{border-color:#d8b878;transform:translateY(-2px)}
.post img{width:92px;height:70px;object-fit:cover;border-radius:8px;flex:0 0 auto;background:#151e2c}

.post span{font-size:12px;color:#93a0b4}
.post div{min-width:0}
.pin{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:999px;background:rgba(216,184,120,.16);border:1px solid rgba(216,184,120,.18);color:#f0d9ae;font-size:11px;font-style:normal}

@media(max-width:859px){.post img{width:80px;height:62px}.crumb{padding-top:16px}}

<body>
<!--SHELL:HEADER-->
<main class="wrap">
  <div class="crumb"><a href="/en">Home</a> › <span>Blog</span></div>
  <h1>Cyprus Escort Guides</h1>
  <p class="lead">Area differences, how pricing works, hotel surroundings and what to watch for on a first meeting.</p>
  <div id="list"></div>
</main>
<!--SHELL:FOOTER-->
<script>
(function () {
  var SB = 'https://accerzwswgiqhtfgoeqv.supabase.co';
  var KEY = 'sb_publishable_MghJlNwUcMgsHY6UfQ9hSw_gDfS_HfG';
  var H = { apikey: KEY, Authorization: 'Bearer ' + KEY };
  var HUB = 'kibrista-yalniz-gelenler-rehberi';
  var LOC = 'en-US';
  var list = document.getElementById('list');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function render(p, same) {
    var arr = (p || []).slice().sort(function (a, b) {
      if (a.slug === HUB) return -1;
      if (b.slug === HUB) return 1;
      return 0;
    });
    if (!arr.length) { list.innerHTML = '<p class="bos">No articles yet.</p>'; return; }
    var out = same ? '' : '<p class="bos" style="grid-column:1/-1">No English articles yet — showing the Turkish archive.</p>';
    out += arr.map(function (x) {
      var d = new Date(x.created_at).toLocaleDateString(LOC);
      var im = x.img ? '<img src="' + esc(x.img) + '" alt="' + esc(x.title) + '" width="92" height="70" loading="lazy" decoding="async">' : '';
      var pin = x.slug === HUB ? '<em class="pin">Featured</em>' : '';
      var href = (same ? '/en/blog/' : '/blog/') + esc(x.slug);
      return '<a class="post" href="' + href + '">' + im + '<div><b>' + esc(x.title) + '</b><span>' + d + pin + '</span></div></a>';
    }).join('');
    list.innerHTML = out;
  }

  fetch(SB + '/rest/v1/posts?select=slug,title,created_at,img&published=eq.true&lang=eq.en&order=created_at.desc', { headers: H })
    .then(function (r) { if (!r.ok) throw new Error('x'); return r.json(); })
    .then(function (p) {
      if (p && p.length) { render(p, true); return; }
      return fetch(SB + '/rest/v1/posts?select=slug,title,created_at,img&published=eq.true&order=created_at.desc', { headers: H })
        .then(function (r) { if (!r.ok) throw new Error('x'); return r.json(); })
        .then(function (t) { render(t, false); });
    })
    .catch(function () {
      list.innerHTML = '<p class="bos">Articles could not be loaded.</p>';
    });
})();
</script>
