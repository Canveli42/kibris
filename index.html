<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yazı</title>
<meta name="description" content="Kıbrıs escort rehberi.">
<link rel="icon" href="/favicon.png">
<link rel="canonical" href="https://kibrisgirneescort.com/blog">
<link rel="stylesheet" href="/style.css">
<style>
#body h2{font-size:21px;margin:26px 0 10px;letter-spacing:-.02em}
#body h3{font-size:17px;margin:20px 0 8px}
#body p{margin-bottom:14px}
#body ul{margin:0 0 14px 20px;color:var(--muted)}
#body li{margin-bottom:6px}
#body strong{color:#fff}
#body a{color:var(--gold);text-decoration:underline;text-underline-offset:2px}
#body a:hover{color:#fff}
#cover{display:none;width:100%;max-width:720px;border-radius:12px;border:1px solid var(--line);margin:18px 0 0;object-fit:cover}
.byline{font-size:13px;color:var(--muted);margin-top:6px}
.faq2{max-width:720px;margin-top:32px}
.faq2 h2{font-size:21px;margin-bottom:12px;letter-spacing:-.02em}
.faq2 details{border-bottom:1px solid var(--line);padding:12px 0}
.faq2 summary{cursor:pointer;font-weight:600;font-size:15px}
.faq2 p{color:var(--muted);margin-top:8px;font-size:15px}
</style>
</head>
<body>
<header><div class="wrap hrow">
  <a class="logo" href="/">Kıbrıs <span>Escort</span></a>
  <nav>
    <a href="/girne-escort">Girne</a><a href="/lefkosa-escort">Lefkoşa</a>
    <a href="/magusa-escort">Mağusa</a><a href="/iskele-escort">İskele</a>
    <a href="/fiyatlar">Fiyatlar</a><a href="/blog">Blog</a><a href="/iletisim">İletişim</a>
  </nav>
  <a class="btn" id="waTop" href="#">WhatsApp</a>
</div></header>

<main class="wrap">
  <div class="crumb"><a href="/">Ana sayfa</a> › <a href="/blog">Blog</a> › <span id="cr"></span></div>
  <h1 id="h1">Yükleniyor…</h1>
  <p class="byline" id="byline"></p>
  <img id="cover" alt="">
  <article id="body" style="max-width:720px;margin-top:22px"></article>

  <section class="faq2" id="faq"></section>

  <div class="about" style="margin-top:32px">
    <b>Sorun mu var, katalog mu lazım?</b><br>
    WhatsApp'tan yaz, kaldığın bölgeye göre liste gönderiyoruz.
    <br><br><a class="btn" id="waCta" href="#">WhatsApp'tan yaz</a>
  </div>

  <section class="sect">
    <h2>Diğer yazılar</h2>
    <div id="more" style="display:flex;flex-direction:column;gap:8px"></div>
  </section>
</main>

<footer><div class="wrap">
  <p id="brand">RedKıbrıs · Kıbrıs Escort</p>
  <p><a id="waFoot" href="#" style="color:var(--gold)">WhatsApp</a> · <a id="tgFoot" href="#" style="color:var(--gold)">Telegram</a></p>
</div></footer>
<a class="btn fix" id="waFix" href="#">WhatsApp'tan yaz</a>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=supabase.createClient("https://accerzwswgiqhtfgoeqv.supabase.co","sb_publishable_MghJlNwUcMgsHY6UfQ9hSw_gDfS_HfG");
const slug=location.pathname.replace(/^\/blog\//,"").replace(/\/$/,"");

function fmt(t){
  return t
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2">$1</a>');
}

(async()=>{
  const {data:s}=await db.from("settings").select("key,value");
  const c={};(s||[]).forEach(r=>c[r.key]=r.value);
  const w="https://wa.me/"+c.whatsapp+"?text="+encodeURIComponent("Merhaba, katalog alabilir miyim?");
  ["waTop","waCta","waFix","waFoot"].forEach(i=>document.getElementById(i).href=w);
  if(c.brand)document.getElementById("brand").textContent=c.brand+" · Kıbrıs Escort";
  if(c.telegram)document.getElementById("tgFoot").href="https://t.me/"+c.telegram;

  const {data:p}=await db.from("posts").select("*").eq("slug",slug).eq("published",true).single();

  if(!p){
    document.title="Yazı bulunamadı | RedKıbrıs";
    document.getElementById("h1").textContent="Yazı bulunamadı";
    const nr=document.createElement("meta");nr.setAttribute("name","robots");nr.setAttribute("content","noindex,follow");
    document.head.appendChild(nr);
    document.getElementById("cover").style.display="none";
    const {data:m0}=await db.from("posts").select("slug,title").eq("published",true).order("created_at",{ascending:false}).limit(8);
    document.getElementById("more").innerHTML=(m0||[]).map(x=>`<a href="/blog/${x.slug}" style="color:var(--gold)">${x.title}</a>`).join("");
    return;
  }

  document.title=p.title+" | RedKıbrıs";
  document.getElementById("cr").textContent=p.title;
  document.getElementById("h1").textContent=p.title;

  const d=new Date(p.created_at);
  const gun=d.toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"});
  const kelime=p.body.split(/\s+/).length;
  const dk=Math.max(2,Math.round(kelime/200));
  document.getElementById("byline").textContent=
    "Can · "+(c.brand||"RedKıbrıs")+" · "+gun+" · "+dk+" dk okuma";

  if(p.img){
    const cv=document.getElementById("cover");
    cv.src=p.img;
    cv.alt=p.title;
    cv.style.display="block";
  }

  let html="",inUl=false;
  for(const raw of p.body.split("\n")){
    const b=raw.trim();
    if(!b){if(inUl){html+="</ul>";inUl=false}continue}
    if(b.startsWith("## ")){if(inUl){html+="</ul>";inUl=false}html+=`<h2>${fmt(b.slice(3))}</h2>`;continue}
    if(b.startsWith("### ")){if(inUl){html+="</ul>";inUl=false}html+=`<h3>${fmt(b.slice(4))}</h3>`;continue}
    if(b.startsWith("- ")){if(!inUl){html+="<ul>";inUl=true}html+=`<li>${fmt(b.slice(2))}</li>`;continue}
    if(inUl){html+="</ul>";inUl=false}
    html+=`<p>${fmt(b)}</p>`;
  }
  if(inUl)html+="</ul>";
  document.getElementById("body").innerHTML=html;

  const faqPairs=(p.faq||"").split("\n")
    .map(l=>l.split("|").map(x=>x.trim()))
    .filter(a=>a[0]&&a[1]);
  if(faqPairs.length){
    document.getElementById("faq").innerHTML=
      "<h2>Sık sorulan sorular</h2>"+
      faqPairs.map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join("");
  }

  const url="https://kibrisgirneescort.com/blog/"+slug;
  const cl=document.querySelector('link[rel="canonical"]');if(cl)cl.href=url;

  const desc=(p.meta||p.body.replace(/[#*\[\]\(\)]/g," ").replace(/https?:\/\/\S+/g,"").replace(/\s+/g," ").trim()).slice(0,158);

  const setMeta=(attr,name,val)=>{
    let e=document.head.querySelector(`meta[${attr}="${name}"]`);
    if(!e){e=document.createElement("meta");e.setAttribute(attr,name);document.head.appendChild(e)}
    e.setAttribute("content",val);
  };
  setMeta("property","og:url",url);
  setMeta("property","og:title",p.title);
  setMeta("property","og:type","article");
  setMeta("name","description",desc);
  setMeta("property","og:description",desc);
  if(p.img)setMeta("property","og:image",p.img);

  const ld=document.createElement("script");ld.type="application/ld+json";
  ld.textContent=JSON.stringify({"@context":"https://schema.org","@type":"Article",headline:p.title,description:desc,datePublished:p.created_at,dateModified:p.created_at,url:url,image:p.img?[p.img]:undefined,author:{"@type":"Person",name:"Can"},publisher:{"@type":"Organization",name:(c.brand||"RedKıbrıs")}});
  document.head.appendChild(ld);

  const bc=document.createElement("script");bc.type="application/ld+json";
  bc.textContent=JSON.stringify({"@context":"https://schema.org","@type":"BreadcrumbList",itemListElement:[
    {"@type":"ListItem",position:1,name:"Ana sayfa",item:"https://kibrisgirneescort.com/"},
    {"@type":"ListItem",position:2,name:"Blog",item:"https://kibrisgirneescort.com/blog"},
    {"@type":"ListItem",position:3,name:p.title,item:url}
  ]});
  document.head.appendChild(bc);

  if(faqPairs.length){
    const fq=document.createElement("script");fq.type="application/ld+json";
    fq.textContent=JSON.stringify({"@context":"https://schema.org","@type":"FAQPage",mainEntity:faqPairs.map(([q,a])=>({"@type":"Question",name:q,acceptedAnswer:{"@type":"Answer",text:a}}))});
    document.head.appendChild(fq);
  }

  const {data:m}=await db.from("posts").select("slug,title").eq("published",true).neq("slug",slug).order("created_at",{ascending:false}).limit(5);
  document.getElementById("more").innerHTML=(m||[]).map(x=>`<a href="/blog/${x.slug}" style="color:var(--gold)">${x.title}</a>`).join("")||'<span style="color:var(--muted)">Yazı yok.</span>';
})();
</script>
<script src="/js/analytics.js" defer></script>
</body>
</html>
